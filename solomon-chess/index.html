<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Solomon — A Game of Chess</title>
    <script>
      // earliest-possible error capture (before any module can fail)
      window.__errors = [];
      window.addEventListener("error", function (e) {
        window.__errors.push("ERROR: " + e.message + " @" + (e.filename || "") + ":" + (e.lineno || 0));
        var el = document.getElementById("boot-error");
        if (!el) {
          el = document.createElement("div");
          el.id = "boot-error";
          el.style.cssText = "position:fixed;left:8px;top:8px;right:8px;z-index:999;background:#3a1414;color:#ffb3a6;font:12px/1.5 monospace;padding:10px;border-radius:8px;white-space:pre-wrap;max-height:50vh;overflow:auto";
          document.body.appendChild(el);
        }
        el.textContent += "ERROR: " + e.message + " @" + (e.filename || "") + ":" + (e.lineno || 0) + "\n";
      });
      window.addEventListener("unhandledrejection", function (e) {
        window.__errors.push("REJECTION: " + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason)));
      });
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #0b0d10; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="loading-veil">Preparing the board…</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
